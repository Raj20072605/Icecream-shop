<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Scoops</title>
</head>
<body>
    <script>
        const loggedInUser = localStorage.getItem("sweetScoopsLoggedInUser");

        if (loggedInUser) {
            window.location.replace("shop.html");
        } else {
            window.location.replace("login.html");
        }
    </script>
</body>
</html>
